<figure class="dia dia--loop">
  <div class="dia__scroll">
  <svg viewBox="0 0 760 500" class="dia__svg" role="img" aria-labelledby="csda-hl-t csda-hl-d">
    <title id="csda-hl-t">One turn of the harness, in sequence</title>
    <desc id="csda-hl-d">The harness picks the next pending requirement, skipping any that wait
      for an answer, creates a git worktree on a branch named after it, and hands the agent a
      prompt built from its Gherkin. The agent writes code and tests in the worktree. The
      harness runs the gate: strict validation, a check that the specification was not
      touched, and the project's own tests. Green: the requirement is marked done and committed
      on its branch. Red: the failures go into the next attempt's prompt, up to the maximum
      number of attempts; after the last one the work is committed as a failed attempt and the
      requirement stays Draft. Either way the harness reports and never merges.</desc>

    <defs>
      <marker id="csda-hl-a" viewBox="0 0 10 8" refX="9" refY="4"
              markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--fg-soft)"/>
      </marker>
      <marker id="csda-hl-g" viewBox="0 0 10 8" refX="9" refY="4"
              markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--green)"/>
      </marker>
      <marker id="csda-hl-r" viewBox="0 0 10 8" refX="9" refY="4"
              markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--red)"/>
      </marker>
    </defs>

    <g class="dia__lane">
      <rect x="10"  y="10" width="140" height="34" rx="8"/>
      <rect x="210" y="10" width="140" height="34" rx="8"/>
      <rect x="400" y="10" width="140" height="34" rx="8"/>
      <rect x="600" y="10" width="140" height="34" rx="8"/>
    </g>
    <g class="dia__actor">
      <text x="80"  y="32" text-anchor="middle">harness</text>
      <text x="280" y="32" text-anchor="middle">git worktree</text>
      <text x="470" y="32" text-anchor="middle">your agent</text>
      <text x="670" y="32" text-anchor="middle">the gate</text>
    </g>

    <g class="dia__life">
      <line x1="80"  y1="48" x2="80"  y2="470"/>
      <line x1="280" y1="48" x2="280" y2="470"/>
      <line x1="470" y1="48" x2="470" y2="470"/>
      <line x1="670" y1="48" x2="670" y2="470"/>
    </g>

    <g class="dia__msg">
      <text x="98" y="74"><tspan class="dia__step">1</tspan> the next pending requirement —</text>
      <text x="112" y="90">never one waiting for an answer</text>

      <line x1="80" y1="130" x2="274" y2="130" marker-end="url(#csda-hl-a)"/>
      <text x="86" y="122"><tspan class="dia__step">2</tspan> worktree on <tspan class="dia__mono">harness/REQ-001</tspan></text>

      <line x1="80" y1="180" x2="464" y2="180" marker-end="url(#csda-hl-a)"/>
      <text x="86" y="172"><tspan class="dia__step">3</tspan> the prompt — its Gherkin, the rules, the boundaries</text>

      <line x1="470" y1="226" x2="286" y2="226" marker-end="url(#csda-hl-a)"/>
      <text x="464" y="218" text-anchor="end"><tspan class="dia__step">4</tspan> writes code and tests</text>

      <line x1="80" y1="276" x2="664" y2="276" marker-end="url(#csda-hl-a)"/>
      <text x="86" y="268"><tspan class="dia__step">5</tspan> <tspan class="dia__mono">validate --strict</tspan> · spec untouched · your tests</text>

      <line x1="670" y1="316" x2="86" y2="316" class="dia__ok" stroke-dasharray="6 5" marker-end="url(#csda-hl-g)"/>
      <text x="664" y="308" text-anchor="end" class="dia__ok-t">green → mark done, commit on the branch</text>

      <line x1="670" y1="360" x2="86" y2="360" class="dia__no" stroke-dasharray="6 5" marker-end="url(#csda-hl-r)"/>
      <text x="664" y="352" text-anchor="end" class="dia__no-t">red → the failures go into the next prompt</text>

      <path d="M74 366 C 30 366, 30 186, 74 186" class="dia__no" stroke-dasharray="4 4" marker-end="url(#csda-hl-r)"/>
      <text x="14" y="282" class="dia__no-t dia__small" transform="rotate(-90 14 282)" text-anchor="middle">next attempt · up to max_attempts</text>
    </g>

    <text x="98" y="410" class="dia__note">Out of attempts: the work is kept as a <tspan class="dia__mono">wip(…): FAILED the gate</tspan> commit,</text>
    <text x="98" y="426" class="dia__note">and the requirement stays Draft — <tspan class="dia__mono">done</tspan> never ran.</text>
    <text x="98" y="458" class="dia__note">Then it reports. It never merges — that stays yours.</text>
  </svg>
  </div>
</figure>
