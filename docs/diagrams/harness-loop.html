<figure class="dia dia--loop">
  <div class="dia__scroll">
  <svg viewBox="0 0 960 400" class="dia__svg" role="img" aria-labelledby="csda-hl-t csda-hl-d">
    <title id="csda-hl-t">One turn of the harness, per requirement</title>
    <desc id="csda-hl-d">Five steps in a row. The harness picks the next pending requirement,
      never one waiting for an answer; creates a git worktree on a branch named after it;
      builds a prompt from its Gherkin, the rules and the boundaries; your agent writes code
      and tests; the gate runs strict validation, checks the specification was not touched,
      and runs your tests. Red: the failures go into the next prompt, up to the maximum number
      of attempts. Out of attempts: the work is committed as a failed attempt and the
      requirement stays Draft. Green: the requirement is marked done and committed on its
      branch, and the harness moves to the next pending requirement. It never merges.</desc>

    <defs>
      <marker id="csda-hl-a" viewBox="0 0 10 8" refX="9" refY="4"
              markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--fg-soft)"/>
      </marker>
      <marker id="csda-hl-g" viewBox="0 0 10 8" refX="9" refY="4"
              markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--green)"/>
      </marker>
      <marker id="csda-hl-r" viewBox="0 0 10 8" refX="9" refY="4"
              markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--red)"/>
      </marker>
    </defs>

    <g class="dia__box">
      <rect x="20"  y="60" width="160" height="100"/>
      <rect x="210" y="60" width="160" height="100"/>
      <rect x="400" y="60" width="160" height="100"/>
      <rect x="590" y="60" width="160" height="100"/>
    </g>
    <g class="dia__box dia__box--gate">
      <rect x="780" y="60" width="160" height="100"/>
    </g>
    <g class="dia__box dia__box--ok">
      <rect x="780" y="214" width="160" height="78"/>
    </g>
    <g class="dia__box dia__box--no">
      <rect x="540" y="214" width="200" height="78"/>
    </g>

    <g>
      <text x="36" y="90"  class="dia__h"><tspan class="dia__step">01</tspan>  Pick</text>
      <text x="36" y="114" class="dia__s">the next pending</text>
      <text x="36" y="132" class="dia__s">requirement — never one</text>
      <text x="36" y="150" class="dia__s">waiting for an answer</text>

      <text x="226" y="90"  class="dia__h"><tspan class="dia__step">02</tspan>  Worktree</text>
      <text x="226" y="114" class="dia__s">its own branch:</text>
      <text x="226" y="132" class="dia__s dia__mono">harness/REQ-007</text>

      <text x="416" y="90"  class="dia__h"><tspan class="dia__step">03</tspan>  Prompt</text>
      <text x="416" y="114" class="dia__s">its Gherkin, the rules,</text>
      <text x="416" y="132" class="dia__s">the boundaries</text>

      <text x="606" y="90"  class="dia__h"><tspan class="dia__step">04</tspan>  Your agent</text>
      <text x="606" y="114" class="dia__s">writes code and tests —</text>
      <text x="606" y="132" class="dia__s">any CLI, no SDK</text>

      <text x="796" y="90"  class="dia__h dia__on-gate">05  The gate</text>
      <text x="796" y="114" class="dia__s dia__mono dia__on-gate">validate --strict</text>
      <text x="796" y="132" class="dia__s dia__on-gate">spec untouched</text>
      <text x="796" y="150" class="dia__s dia__on-gate">your tests</text>

      <text x="796" y="242" class="dia__h dia__ok-t">✔ Green</text>
      <text x="796" y="264" class="dia__s">marked done, committed</text>
      <text x="796" y="282" class="dia__s">on its branch</text>

      <text x="556" y="242" class="dia__h dia__no-t">✖ Out of attempts</text>
      <text x="556" y="264" class="dia__s dia__mono">wip(…): FAILED the gate</text>
      <text x="556" y="282" class="dia__s">stays Draft — done never ran</text>
    </g>

    <g class="dia__msg">
      <line x1="180" y1="110" x2="206" y2="110" marker-end="url(#csda-hl-a)"/>
      <line x1="370" y1="110" x2="396" y2="110" marker-end="url(#csda-hl-a)"/>
      <line x1="560" y1="110" x2="586" y2="110" marker-end="url(#csda-hl-a)"/>
      <line x1="750" y1="110" x2="776" y2="110" marker-end="url(#csda-hl-a)"/>

      <path d="M860 60 V34 H480 V56" class="dia__no" marker-end="url(#csda-hl-r)"/>
      <text x="670" y="26" text-anchor="middle" class="dia__no-t">✖ red — the failures go into the next prompt · up to max_attempts</text>

      <line x1="880" y1="160" x2="880" y2="210" class="dia__ok" marker-end="url(#csda-hl-g)"/>
      <path d="M820 160 V186 H640 V210" class="dia__no" stroke-dasharray="5 4" marker-end="url(#csda-hl-r)"/>

      <path d="M860 292 V318 H100 V164" class="dia__ok" stroke-dasharray="6 5" marker-end="url(#csda-hl-g)"/>
      <text x="480" y="338" text-anchor="middle" class="dia__ok-t">next pending requirement</text>
    </g>

    <text x="20" y="380" class="dia__note">Then it reports. It never merges — the branch is yours to merge or throw away.</text>
  </svg>
  </div>
</figure>
