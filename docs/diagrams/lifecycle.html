<figure class="dia dia--lifecycle">
  <div class="dia__scroll">
  <svg viewBox="0 0 760 350" class="dia__svg" role="img" aria-labelledby="specgate-lc-t specgate-lc-d">
    <title id="specgate-lc-t">The lifecycle of a requirement</title>
    <desc id="specgate-lc-d">Three phases in order. Specify: keep the brief in the repository,
      draft a module as a change with specgate propose --from-brief, run the same command until
      the draft is Ready to review, and a person approves it at a terminal with specgate change
      approve; an agent cannot, and approval writes the feature files. Build: status names the
      next requirement, a test that names it comes first, then the code, by a person or by the
      harness in its own branch. Prove: specgate apply is the gate and marks the requirement
      Implemented only if it passes; specgate archive merges the change once every requirement in
      it is applied; check runs the whole gate in CI. A requirement that arrives waiting for an
      answer stays out of Build until the client answers; the answer changes it, so a person
      approves it again before it rejoins.</desc>

    <defs>
      <marker id="specgate-lc-a" viewBox="0 0 10 8" refX="9" refY="4"
              markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--fg-soft)"/>
      </marker>
      <marker id="specgate-lc-w" viewBox="0 0 10 8" refX="9" refY="4"
              markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--amber)"/>
      </marker>
    </defs>

    <text x="12"  y="30" class="dia__phase">SPECIFY</text>
    <text x="262" y="30" class="dia__phase">BUILD</text>
    <text x="512" y="30" class="dia__phase">PROVE</text>

    <g class="dia__box">
      <rect x="12" y="44"  width="236" height="50" rx="9"/>
      <rect x="12" y="108" width="236" height="50" rx="9"/>
      <rect x="12" y="172" width="236" height="50" rx="9"/>
      <rect x="262" y="44"  width="236" height="50" rx="9"/>
      <rect x="262" y="108" width="236" height="50" rx="9"/>
      <rect x="262" y="172" width="236" height="50" rx="9"/>
      <rect x="512" y="108" width="236" height="50" rx="9"/>
      <rect x="512" y="172" width="236" height="50" rx="9"/>
    </g>
    <g class="dia__box dia__box--ok">
      <rect x="12" y="236" width="236" height="50" rx="9"/>
    </g>
    <g class="dia__box dia__box--gate">
      <rect x="512" y="44" width="236" height="50" rx="9"/>
    </g>
    <g class="dia__box dia__box--wait">
      <rect x="262" y="246" width="236" height="62" rx="9"/>
    </g>

    <g>
      <text x="26" y="65"  class="dia__h"><tspan class="dia__step">1</tspan>  Brief</text>
      <text x="26" y="83"  class="dia__s dia__mono">docs/brief.md</text>
      <text x="26" y="129" class="dia__h"><tspan class="dia__step">2</tspan>  Draft one module</text>
      <text x="26" y="147" class="dia__s dia__mono">specgate propose --from-brief</text>
      <text x="26" y="193" class="dia__h"><tspan class="dia__step">3</tspan>  Check: Ready to review</text>
      <text x="26" y="211" class="dia__s">the same command, until it passes</text>
      <text x="26" y="257" class="dia__h"><tspan class="dia__step">4</tspan>  <tspan class="dia__ok-t">A person approves</tspan></text>
      <text x="26" y="275" class="dia__s dia__mono">specgate change approve &lt;id&gt;</text>

      <text x="276" y="65"  class="dia__h"><tspan class="dia__step">5</tspan>  What is next</text>
      <text x="276" y="83"  class="dia__s dia__mono">specgate status</text>
      <text x="276" y="129" class="dia__h"><tspan class="dia__step">6</tspan>  A test that names it</text>
      <text x="276" y="147" class="dia__s dia__mono">// REQ-007 SCN-007a — …</text>
      <text x="276" y="193" class="dia__h"><tspan class="dia__step">7</tspan>  The code</text>
      <text x="276" y="211" class="dia__s">a person, or the harness, one branch each</text>

      <text x="526" y="65"  class="dia__h dia__on-gate"><tspan>8</tspan>  Apply — the gate</text>
      <text x="526" y="83"  class="dia__s dia__mono dia__on-gate">specgate apply</text>
      <text x="526" y="129" class="dia__h"><tspan class="dia__step">9</tspan>  Archive — all applied</text>
      <text x="526" y="147" class="dia__s dia__mono">specgate archive &lt;change-id&gt;</text>
      <text x="526" y="193" class="dia__h"><tspan class="dia__step">10</tspan>  The gate, in CI</text>
      <text x="526" y="211" class="dia__s dia__mono">specgate check</text>

      <text x="276" y="268" class="dia__s dia__wait-t">Waiting for an answer</text>
      <text x="276" y="285" class="dia__s">a question blocks it: harness and apply</text>
      <text x="276" y="300" class="dia__s">refuse it — answered → approve again (4)</text>
    </g>

    <g class="dia__msg">
      <line x1="130" y1="94"  x2="130" y2="104" marker-end="url(#specgate-lc-a)"/>
      <line x1="130" y1="158" x2="130" y2="168" marker-end="url(#specgate-lc-a)"/>
      <line x1="130" y1="222" x2="130" y2="232" marker-end="url(#specgate-lc-a)"/>
      <path d="M248 252 H254 V69 H258" marker-end="url(#specgate-lc-a)"/>
      <line x1="380" y1="94"  x2="380" y2="104" marker-end="url(#specgate-lc-a)"/>
      <line x1="380" y1="158" x2="380" y2="168" marker-end="url(#specgate-lc-a)"/>
      <path d="M498 197 H504 V69 H508" marker-end="url(#specgate-lc-a)"/>
      <line x1="630" y1="94"  x2="630" y2="104" marker-end="url(#specgate-lc-a)"/>
      <line x1="630" y1="158" x2="630" y2="168" marker-end="url(#specgate-lc-a)"/>
      <path d="M248 276 H258" stroke-dasharray="5 4" style="stroke: var(--amber)" marker-end="url(#specgate-lc-w)"/>
    </g>

    <text x="12" y="336" class="dia__note">Nothing is built before a person approves it; nothing counts as delivered until the gate has checked it.</text>
  </svg>
  </div>
</figure>
