    <title id="sg-gt-t">The gate said no — what now: each kind of failure, and the one thing to do</title>
    <desc id="sg-gt-d">Seven kinds of failure on the left, each with its codes, and on the right
      the one action that answers it. The tests are red, check_tests_failed or acceptance_red:
      fix the code, not the test, because the tests are the contract. No test names the
      requirement, apply_no_test: write the test that names it first, with REQ-007 in it, then
      run apply again. What a person approved has changed, approved_requirement_changed or
      acceptance_not_sealed: put it back, or a person approves it again with specgate change
      approve. A new file the approved design does not name, file_outside_design: name it in
      design.md and have the design approved again, or open a change for it with specgate
      propose. Nobody approved the change, change_not_approved: a person approves it, at a
      terminal, with specgate change approve. A scenario failed, check_scenarios_failed: make
      the code do what the scenario says; specgate scenarios with the requirement id runs them
      one by one. The branch changes the controls, controls_changed_on_branch, a warning named
      by check --base: the reviewer reads it as part of the pull request. Nobody edits the
      approval record by hand; every failure prints its fix on the line below it.</desc>
