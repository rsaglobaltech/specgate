<figure class="dia dia--card dia--ci">
  <div class="dia__scroll">
  <svg viewBox="0 0 960 520" class="dia__svg" role="img" aria-labelledby="sg-ci-t sg-ci-d">
    <title id="sg-ci-t">A pull request through the gate in CI</title>
    <desc id="sg-ci-d">You push a branch and open its pull request against the base branch.
      The CI job checks the repository out with its whole history, fetch-depth 0, so the
      requirement ids can be compared with the base, and runs the gate: specgate check with
      --base origin/base, on Ubuntu, macOS and Windows; then quality run --stage ci, the
      ci-stage quality checks, on Ubuntu. The gate's stages run in order: ids, changes,
      validate, architecture, tests, scenarios, acceptance and quality. If a stage fails, the
      job is red and the merge is blocked: the first failing stage names its code and its
      fix, for example id_taken_on_base — REQ-012 means something else on origin/main — with
      the fix to renumber it to the next id free on both sides; you fix it and push again. If
      every stage passes, a person reviews: the delta in docs/specs/changes, and what the
      branch changes in the controls — the guard, gate.yaml, approvals and evidence —
      reported as controls_changed_on_branch, a warning for the reviewer, not a block. Then
      the branch merges. A red job blocks the merge only once spec-gate is a required check
      of the branch.</desc>

    </defs>

    <g>
      <text x="64" y="73" class="dia__h"><tspan class="dia__step">1</tspan>  Push</text>
      <text x="28" y="104" class="dia__s">a branch, and open</text>
      <text x="28" y="122" class="dia__s">its pull request</text>
      <text x="28" y="140" class="dia__s">against the base:</text>
      <text x="28" y="158" class="dia__s dia__mono">main, develop…</text>

      <text x="282" y="73" class="dia__h dia__on-ink">2  The CI job runs the gate</text>
      <text x="246" y="104" class="dia__s dia__on-ink">checkout with <tspan class="dia__mono">fetch-depth: 0</tspan>,</text>
      <text x="246" y="122" class="dia__s dia__on-ink">so the ids meet the base; then</text>
      <text x="246" y="144" class="dia__s dia__mono dia__on-ink">check . --base origin/&lt;base&gt;</text>
      <text x="246" y="162" class="dia__s dia__on-ink">on Ubuntu, macOS and Windows</text>
      <text x="246" y="184" class="dia__s dia__mono dia__on-ink">quality run --stage ci</text>
      <text x="246" y="202" class="dia__s dia__on-ink">the ci-stage checks, on Ubuntu</text>
    </g>

      <text x="812" y="93"><tspan class="dia__step">03</tspan></text><text x="812" y="111">validate</text>
      <text x="900" y="93"><tspan class="dia__step">04</tspan></text><text x="900" y="111" class="dia__small">architecture</text>
      <text x="632" y="147"><tspan class="dia__step">05</tspan></text><text x="632" y="165">tests</text>
      <text x="722" y="147"><tspan class="dia__step">06</tspan></text><text x="722" y="165">scenarios</text>
      <text x="812" y="147"><tspan class="dia__step">07</tspan></text><text x="812" y="165">acceptance</text>
      <text x="900" y="147"><tspan class="dia__step">08</tspan></text><text x="900" y="165">quality</text>
    </g>
    <text x="594" y="196" class="dia__s">08: <tspan class="dia__mono">harness.config.yaml</tspan>; in CI, the ci ones too</text>

    <g>
      <text x="64" y="293" class="dia__h dia__no-t">Red — the merge is blocked</text>
      <text x="28" y="324" class="dia__s">the first stage that fails names its code and its fix:</text>
      <text x="28" y="348" class="dia__s dia__mono">id_taken_on_base</text>
      <text x="28" y="368" class="dia__s">REQ-012 means something else on origin/main</text>
      <text x="28" y="390" class="dia__s">fix: renumber REQ-012 on this branch to</text>
      <text x="28" y="408" class="dia__s">the next id free on both sides</text>

      <text x="544" y="293" class="dia__h dia__ok-t">Green — a person reviews</text>
      <text x="508" y="324" class="dia__s">the delta, in <tspan class="dia__mono">docs/specs/changes/&lt;id&gt;/</tspan>, and</text>
      <text x="508" y="342" class="dia__s">what the branch changes in the controls:</text>
      <text x="508" y="366" class="dia__s dia__mono">controls_changed_on_branch</text>
      <text x="508" y="388" class="dia__s">the guard, gate.yaml, approvals, evidence —</text>
      <text x="508" y="406" class="dia__s">a warning for the reviewer, not a block</text>

      <text x="544" y="481" class="dia__h dia__ok-t">Merge</text>
      <text x="544" y="500" class="dia__s">once the reviewer is satisfied and spec-gate is green</text>
    </g>

    <g class="dia__msg">
      <line x1="204" y1="110" x2="225" y2="110" marker-end="url(#sg-ci-a)"/>
      <line x1="552" y1="110" x2="573" y2="110" marker-end="url(#sg-ci-a)"/>

      <line x1="800" y1="212" x2="800" y2="255" class="dia__ok" marker-end="url(#sg-ci-g)"/>
      <text x="810" y="240" class="dia__ok-t">all green</text>

      <line x1="107" y1="258" x2="107" y2="215" class="dia__no" marker-end="url(#sg-ci-r)"/>
      <text x="117" y="244" class="dia__no-t">fix, push again</text>

      <line x1="720" y1="422" x2="720" y2="451" class="dia__ok" marker-end="url(#sg-ci-g)"/>
    </g>

    <text x="12" y="478" class="dia__note">A red job blocks the merge only once spec-gate</text>
    <text x="12" y="494" class="dia__note">is a required check of the branch.</text>
  </svg>
  </div>
  <figcaption>On every pull request the CI job runs the gate against the base branch: red blocks the merge with the code and its fix, green hands the delta and any change to the controls to a reviewer.</figcaption>
</figure>
