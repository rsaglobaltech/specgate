<figure class="dia dia--card dia--fast">
  <div class="dia__scroll">
  <svg viewBox="0 0 960 400" class="dia__svg" role="img" aria-labelledby="sg-fg-t sg-fg-d">
    <title id="sg-fg-t">What specgate check --affected runs, and when it runs everything</title>
    <desc id="sg-fg-d">specgate check --affected starts from the files changed since the base:
      --base, else SPECGATE_BASE, else origin's default branch, counting uncommitted and
      untracked files. From them it finds the touched requirements: those whose spec,
      feature, code or test changed, found through the traceability matrix and, in
      JavaScript and TypeScript, the relative imports. Their tests run, passed to the test
      command as {files} in test_cmd_affected. A test that already passed on the same code is
      not run again: it comes from the cache and is listed under selection.cached. When it
      cannot say what the change needs, it runs the whole suite and says why under
      selection.reason: a change to package.json, a lockfile, harness.config.yaml, a tsconfig
      or build configuration, or a file matching a full_on: glob, or a changed file that
      nothing links to. check --ci always runs the whole suite: it ignores --affected
      (affected_ignored_ci) and never uses the cache. check with no flag runs the whole suite
      too, and --no-cache runs every selected test.</desc>

    <defs>
      <marker id="sg-fg-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--fg-soft)"/>
      </marker>
      <marker id="sg-fg-g" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--green)"/>
      </marker>
    </defs>

    <g class="dia__band"><rect x="1" y="1" width="958" height="200"/></g>
    <text x="20" y="26" class="dia__band-t">SPECGATE CHECK --AFFECTED — ONLY WHAT THE CHANGE TOUCHES</text>

    <g class="dia__box">
      <rect x="20" y="44" width="196" height="140"/>
      <rect x="254" y="44" width="220" height="140"/>
    </g>
    <g class="dia__box dia__box--gate"><rect x="510" y="44" width="200" height="140"/></g>
    <g class="dia__box dia__box--ok"><rect x="746" y="44" width="194" height="140"/></g>
    <g class="dia__box dia__box--strong"><rect x="20" y="236" width="454" height="120"/></g>
    <g class="dia__box dia__box--ink"><rect x="510" y="236" width="430" height="120"/></g>

    <g class="dia__ico" transform="translate(352 56)"><path d="m3 17 2 2 4-4"/><path d="m3 7 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></g>
    <g class="dia__ico dia__ico--on-gate" transform="translate(598 56)"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7"/><path d="M7 16h10"/></g>
    <g class="dia__ico dia__ico--ok" transform="translate(831 56)"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></g>
    <g class="dia__ico" transform="translate(36 252)"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></g>
    <g class="dia__ico dia__ico--brand" transform="translate(526 252)"><line x1="6" x2="6" y1="3" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></g>

    <g text-anchor="middle">
      <text x="118" y="104" class="dia__h">Changed since base</text>
      <text x="118" y="126" class="dia__s dia__mono">--base · SPECGATE_BASE</text>
      <text x="118" y="144" class="dia__s">or origin's default</text>
      <text x="118" y="162" class="dia__s">+ uncommitted, untracked</text>

      <text x="364" y="104" class="dia__h">Touched requirements</text>
      <text x="364" y="126" class="dia__s">spec, feature, code or</text>
      <text x="364" y="144" class="dia__s">test changed — found by</text>
      <text x="364" y="162" class="dia__s">the matrix and imports</text>

      <text x="610" y="104" class="dia__h dia__on-gate">Their tests run</text>
      <text x="610" y="126" class="dia__s dia__on-gate">as <tspan class="dia__mono">{files}</tspan> in</text>
      <text x="610" y="144" class="dia__s dia__mono dia__on-gate">test_cmd_affected</text>

      <text x="843" y="104" class="dia__h dia__ok-t">From the cache</text>
      <text x="843" y="126" class="dia__s">passed on the same code:</text>
      <text x="843" y="144" class="dia__s">not run again</text>
      <text x="843" y="162" class="dia__s dia__mono">selection.cached</text>
    </g>

    <g>
      <text x="70" y="268" class="dia__h">Runs the whole suite — and says why</text>
      <text x="70" y="292" class="dia__s dia__mono">package.json · a lockfile · harness.config.yaml</text>
      <text x="70" y="312" class="dia__s">a tsconfig or build config · a <tspan class="dia__mono">full_on:</tspan> glob</text>
      <text x="70" y="332" class="dia__s">a file nothing links to · in <tspan class="dia__mono">selection.reason</tspan></text>

      <text x="560" y="268" class="dia__h dia__on-ink"><tspan class="dia__mono">--ci</tspan> runs everything, always</text>
      <text x="560" y="292" class="dia__s dia__on-ink">--affected is ignored: <tspan class="dia__mono">affected_ignored_ci</tspan></text>
      <text x="560" y="312" class="dia__s dia__on-ink">and the cache is never used</text>
    </g>

    <g class="dia__msg">
      <line x1="218" y1="114" x2="249" y2="114" marker-end="url(#sg-fg-a)"/>
      <line x1="476" y1="114" x2="505" y2="114" marker-end="url(#sg-fg-a)"/>
      <line x1="712" y1="114" x2="741" y2="114" class="dia__ok" marker-end="url(#sg-fg-g)"/>
      <line x1="118" y1="186" x2="118" y2="231" marker-end="url(#sg-fg-a)"/>
      <text x="128" y="222">it cannot tell what the change needs</text>
    </g>

    <text x="0" y="388" class="dia__note">specgate check with no flag runs the whole suite too; --no-cache runs every selected test.</text>
  </svg>
  </div>
  <figcaption>--affected runs only the tests of the requirements a change touches, skips the ones that already passed on the same code, and runs the whole suite, saying why, whenever it cannot tell.</figcaption>
</figure>
