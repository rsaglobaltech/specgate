  <svg viewBox="0 0 960 540" class="dia__svg" role="img" aria-labelledby="sg-pu-t sg-pu-d">
    <title id="sg-pu-t">Upgrading a domain pack: a three-way merge with your spec</title>
    <desc id="sg-pu-d">First, specgate specops diff --pack-version v0.2.0 previews the upgrade:
      the files sync would add and modify, writing nothing. Then three versions meet. The
      merge base is the pack's previous version, v0.1.0, as it was rendered over your spec —
      the baseline specops add recorded under .specops/baseline: REQ-002 with status Draft,
      REQ-003's fee line as v0.1.0 wrote it, and no REQ-006. Yours is spec.md with your
      edits: REQ-002 now status Implemented, the fee line of REQ-003 edited, and REQ-020, a
      requirement of your own. The pack's new version, v0.2.0, gives REQ-002 a depends on
      REQ-001, edits the same fee line, and adds REQ-006, Join Capacity Waitlist. specgate
      specops sync --pack-version v0.2.0 merges them three ways. What the new version changes
      arrives: REQ-006 and REQ-002's depends. What you wrote stays: status Implemented and
      REQ-020. A line both changed is a conflict: the file gets conflict markers, or is left
      untouched with --abort-on-conflict. And if the pack brings an id you already use — had
      your own requirement been REQ-006 — sync fails, naming it: After the sync, REQ-006 is defined twice into
      spec.md. You give yours a free id, rename it in its tests and features, and run
      specgate check.</desc>

      <text x="672" y="236" class="dia__s dia__mono">REQ-003  the fee line, edited</text>
      <text x="672" y="256" class="dia__s dia__mono">+ REQ-006  Join Capacity Waitlist</text>

      <text x="64" y="363" class="dia__h">A three-way merge</text>
      <text x="64" y="383" class="dia__s dia__mono">specgate specops sync --pack-version v0.2.0</text>
      <text x="58" y="418" class="dia__s"><tspan class="dia__ok-t">Arrives</tspan> — what v0.2.0 changes: REQ-006, and REQ-002's depends</text>
      <text x="58" y="448" class="dia__s"><tspan class="dia__ok-t">Stays</tspan> — what you wrote: status=Implemented, and REQ-020</text>
      <text x="58" y="478" class="dia__s"><tspan class="dia__no-t">Conflict</tspan> — both changed the fee line: the file gets conflict markers,</text>
      <text x="58" y="496" class="dia__s">or is left untouched with <tspan class="dia__mono">--abort-on-conflict</tspan></text>

      <text x="714" y="363" class="dia__h dia__no-t">An id you already use</text>
      <text x="678" y="394" class="dia__s">Had yours been REQ-006, the</text>

      <text x="678" y="432" class="dia__s">sync fails, naming it:</text>
      <text x="678" y="452" class="dia__s dia__mono">After the sync, REQ-006 is defined twice</text>
      <text x="678" y="474" class="dia__s">Give yours a free id, rename it in</text>
      <text x="678" y="492" class="dia__s">its tests and features, then run</text>

  <figcaption>A pack upgrade merges the pack's old version, your spec and the pack's new version three ways: the pack's changes arrive, yours stay, and only a line both changed — or an id both use — stops it.</figcaption>
