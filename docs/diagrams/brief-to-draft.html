    <title id="sg-bd-t">From the client's brief to a reviewed draft, one module at a time</title>
    <desc id="sg-bd-d">Seven steps. One: the brief is kept as docs/brief.md, with a front
      matter on top — product, surfaces, actors and modules — and a section per module. Two:
      specgate propose --from-brief lists the modules, where each stands and which is next.
      Three: propose --from-brief with a module name opens the change draft-module, with
      DRAFTING.md as the prompt. Four: your agent drafts it, called with --agent "claude -p",
      or you write it by hand: the delta and its scenarios. Five: the same command run again
      is the checklist, D1 to D12, each finding with its fix — D6, every value in a scenario
      is in the brief or written down as an assumption; D3, a scenario per actor and surface;
      D12, an actor can reach the ids it acts on. Findings go back to the agent, and the loop
      runs until the checklist says Ready to review. Six: beside the delta, the ready draft
      holds assumptions.md, every value the brief does not give with the requirements that
      use it, and questions.md, what only the client can answer and the requirement each
      question blocks. A requirement whose value only the client can give is marked
      status="Needs Clarification" and waits: apply and the harness refuse it until someone
      answers. Seven: a person approves the draft with specgate change approve draft-module,
      and the rest is applied one requirement at a time — a test that names it, then the
      gate, with specgate apply.</desc>

    <g>
      <text x="64" y="73" class="dia__h"><tspan class="dia__step">1</tspan>  The brief</text>
      <text x="28" y="104" class="dia__s dia__mono">docs/brief.md</text>
      <text x="28" y="122" class="dia__s">on top: product, surfaces,</text>
      <text x="28" y="140" class="dia__s">actors, modules —</text>
      <text x="28" y="158" class="dia__s">then a section per module</text>

      <text x="304" y="73" class="dia__h"><tspan class="dia__step">2</tspan>  See the modules</text>
      <text x="268" y="104" class="dia__s dia__mono">propose --from-brief</text>
      <text x="268" y="122" class="dia__s">lists the modules:</text>
      <text x="268" y="140" class="dia__s">where each stands,</text>
      <text x="268" y="158" class="dia__s">and which is next</text>

      <text x="544" y="73" class="dia__h"><tspan class="dia__step">3</tspan>  Open one</text>
      <text x="508" y="104" class="dia__s dia__mono">--from-brief &lt;module&gt;</text>

      <text x="508" y="140" class="dia__s dia__mono">draft-&lt;module&gt;</text>
      <text x="508" y="158" class="dia__s"><tspan class="dia__mono">DRAFTING.md</tspan>: its prompt</text>

      <text x="784" y="73" class="dia__h dia__on-ink">4  Your agent drafts</text>
      <text x="748" y="104" class="dia__s dia__mono dia__on-ink">--agent "claude -p"</text>
      <text x="748" y="122" class="dia__s dia__on-ink">or you, by hand:</text>
      <text x="748" y="140" class="dia__s dia__on-ink">the delta and</text>
      <text x="748" y="158" class="dia__s dia__on-ink">its scenarios</text>

      <text x="644" y="261" class="dia__h dia__on-gate">5  The checklist</text>
      <text x="608" y="292" class="dia__s dia__mono dia__on-gate">propose --from-brief &lt;module&gt;</text>
      <text x="608" y="310" class="dia__s dia__on-gate">again: D1–D12, each with its fix</text>
      <text x="608" y="334" class="dia__s dia__on-gate">D6 every value in the brief or an assumption</text>
      <text x="608" y="352" class="dia__s dia__on-gate">D3 a scenario per actor and surface</text>
      <text x="608" y="370" class="dia__s dia__on-gate">D12 an actor can reach the ids it acts on</text>

      <text x="64" y="261" class="dia__h"><tspan class="dia__step">6</tspan>  Beside the delta</text>
      <text x="28" y="296" class="dia__h dia__mono">assumptions.md</text>
      <text x="28" y="318" class="dia__s">every value the brief does</text>
      <text x="28" y="336" class="dia__s">not give — prices, limits,</text>
      <text x="28" y="354" class="dia__s">status codes — with the</text>
      <text x="28" y="372" class="dia__s">requirements that use it</text>
      <text x="262" y="296" class="dia__h dia__mono">questions.md</text>
      <text x="262" y="318" class="dia__s">what only the client can</text>
      <text x="262" y="336" class="dia__s">answer, and the requirement</text>
      <text x="262" y="354" class="dia__s">each question blocks</text>

      <text x="64" y="473" class="dia__h dia__wait-t">Needs Clarification — it waits</text>
      <text x="28" y="502" class="dia__s">a value only the client can give, such as a fee:</text>
      <text x="28" y="520" class="dia__s">apply and the harness refuse the requirement</text>
      <text x="28" y="538" class="dia__s">until someone answers its question</text>

      <text x="544" y="473" class="dia__h dia__ok-t">7  A person approves the draft</text>
      <text x="508" y="502" class="dia__s dia__mono">specgate change approve draft-&lt;module&gt;</text>
      <text x="508" y="520" class="dia__s">then the rest, one requirement at a time:</text>
      <text x="508" y="538" class="dia__s">a test that names it, the gate — <tspan class="dia__mono">specgate apply</tspan></text>
    </g>
