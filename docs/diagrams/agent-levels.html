    <title id="sg-al-t">What each agent gets from Specgate, and which controls hold where</title>
    <desc id="sg-al-d">A table of four agents against four things Specgate gives them. Claude
      Code: the rules in AGENTS.md; slash commands such as /specgate:apply in
      .claude/commands/; the MCP server through the plugin's .mcp.json; and hooks, the guard,
      from agents init --tool claude-plugin. Codex: AGENTS.md; skills such as $specgate-apply
      in .agents/skills/; the MCP server through mcp install --client codex; and hooks from
      --tool codex-hooks, written to .codex/hooks.json. OpenCode: AGENTS.md; commands such as
      /specgate-apply in .opencode/commands/; the MCP server through mcp install --client
      opencode; and hooks from --tool opencode-plugin. Any other agent CLI: AGENTS.md and the
      prompt that specgate status --prompt prints, to paste; the MCP server if it speaks MCP;
      no hooks, so no guard. Below, which controls hold where. Everywhere: the gate (specgate
      check), the seals, and approval first. With hooks: the guard, which enforces test
      first and refuses a person's acts and writes to sealed tests and control files. With a
      harness or CI: the outside judge, which reads the controls before the agent starts and
      compares them when it stops.</desc>
