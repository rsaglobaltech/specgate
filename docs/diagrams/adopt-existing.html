    <title id="sg-ae-t">Adopting a repository that already runs, then specifying it module by module</title>
    <desc id="sg-ae-d">Six steps. One: your repository, code that already runs, with a build
      file and a test suite that passes. Two: specgate init adopts it in place, the same as
      specgate adopt: it writes spec.md, AGENTS.md, docs/specs, the baseline scenario
      features/adoption/baseline.feature, the gate policy .specgate/gate.yaml and the CI
      job — only files that do not exist yet. Your src and tests folders stay as they are:
      git diff shows new specification files only. Three: specgate check is green on day one,
      with your own tests in it; it certifies the skeleton, not the code yet. Four: specgate
      reverse --modules finds the candidate modules — folders with their own build manifest,
      Go packages, code under src or apps — each with its stack; no agent runs. Five: specgate
      reverse with a module and --agent has your agent read that module and writes the change
      reverse-module: every requirement Draft, each citing in source= the lines it was read
      from. Behaviour that looks like a bug becomes a question in questions.md, never a
      requirement, because written as one the bug would become the contract. A person reads
      each requirement against its lines before moving it past Draft. Six: from then on, one
      behaviour per bug fix — open a change for the behaviour that broke, write the scenario
      that reproduces it, name it in a test, and the fix applies it.</desc>

      <text x="28" y="104" class="dia__s">code that already runs,</text>

      <text x="258" y="126" class="dia__s dia__mono">+ spec.md  + AGENTS.md  + docs/specs/</text>
      <text x="258" y="144" class="dia__s dia__mono">+ features/adoption/baseline.feature</text>
      <text x="258" y="162" class="dia__s dia__mono">+ .specgate/gate.yaml  + the CI job</text>
      <text x="258" y="180" class="dia__s">only files that do not exist yet</text>

      <text x="668" y="104" class="dia__s dia__mono dia__on-gate">specgate check</text>
      <text x="668" y="124" class="dia__s dia__on-gate">Gate passed, with your own</text>
      <text x="668" y="142" class="dia__s dia__on-gate">tests in it — so far it certifies</text>
      <text x="668" y="160" class="dia__s dia__on-gate">the skeleton, not the code</text>

      <text x="56" y="231" class="dia__s"><tspan class="dia__mono">src/</tspan> and <tspan class="dia__mono">tests/</tspan> stay as they are — <tspan class="dia__mono">git diff</tspan> shows new specification files only</text>

      <text x="704" y="333" class="dia__h"><tspan class="dia__step">4</tspan>  Find the modules</text>
      <text x="668" y="364" class="dia__s dia__mono">specgate reverse --modules</text>
      <text x="668" y="384" class="dia__s">folders with their own build</text>
      <text x="668" y="402" class="dia__s">manifest, Go packages, code</text>
      <text x="668" y="420" class="dia__s">under src/ or apps/, each with</text>
      <text x="668" y="438" class="dia__s">its stack — no agent runs</text>

      <text x="374" y="333" class="dia__h dia__on-ink">5  Your agent reads one</text>
      <text x="338" y="364" class="dia__s dia__mono dia__on-ink">reverse orders --agent "…"</text>
      <text x="338" y="384" class="dia__s dia__on-ink">writes the change reverse-orders:</text>
      <text x="338" y="402" class="dia__s dia__on-ink">every requirement Draft, citing</text>
      <text x="338" y="420" class="dia__s dia__on-ink">the lines it was read from</text>
      <text x="338" y="438" class="dia__s dia__mono dia__on-ink">source=…/Cancel.java:12</text>

      <text x="64" y="333" class="dia__h dia__wait-t">Looks like a bug?</text>
      <text x="28" y="364" class="dia__s">a question in <tspan class="dia__mono">questions.md</tspan>,</text>
      <text x="28" y="384" class="dia__s">never a requirement:</text>
      <text x="28" y="402" class="dia__s">written as one, the bug</text>
      <text x="28" y="420" class="dia__s">would become the contract</text>

      <text x="64" y="523" class="dia__h dia__ok-t">6  From then on, one behaviour per bug fix</text>
      <text x="28" y="552" class="dia__s">Before a fix, open a change for the behaviour that broke and write the scenario that reproduces it;</text>
      <text x="28" y="570" class="dia__s">a test names it, and the fix applies it. The specification grows where the risk actually was.</text>
