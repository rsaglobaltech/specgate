<figure class="dia dia--repos">
  <div class="dia__scroll">
  <svg viewBox="0 0 760 360" class="dia__svg" role="img" aria-labelledby="specgate-tr-t specgate-tr-d">
    <title id="specgate-tr-t">The three repositories</title>
    <desc id="specgate-tr-d">The tool is an npm package. A domain pack repository holds
      stack-agnostic templates written by domain experts and is version-tagged like a
      library. An implementation project renders those templates for one stack and records
      which pack version it came from, so a later pack release can be pulled in as a diff.</desc>

    <defs>
      <marker id="specgate-tr-a" viewBox="0 0 10 8" refX="9" refY="4"
              markerWidth="9" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 4 L0 8 Z" fill="var(--fg-soft)"/>
      </marker>
    </defs>

    <g class="dia__box dia__box--tool">
      <rect x="270" y="12" width="220" height="76" rx="10"/>
    </g>
    <text x="380" y="40" text-anchor="middle" class="dia__h">Specgate</text>
    <text x="380" y="60" text-anchor="middle" class="dia__s">the tool · one npm package</text>
    <text x="380" y="78" text-anchor="middle" class="dia__s dia__mono">npx @rsaglobaltech/specgate</text>

    <g class="dia__box">
      <rect x="20" y="164" width="330" height="180" rx="10"/>
      <rect x="410" y="164" width="330" height="180" rx="10"/>
    </g>

    <text x="40" y="192" class="dia__h">Domain pack</text>
    <text x="40" y="210" class="dia__s">by domain experts · stack-agnostic</text>
    <text x="40" y="238" class="dia__s dia__mono">pack.yaml</text>
    <text x="40" y="258" class="dia__s dia__mono">templates/spec.md.tpl</text>
    <text x="40" y="278" class="dia__s dia__mono">templates/features/**.feature.tpl</text>
    <text x="40" y="306" class="dia__s">pinned by tag — <tspan class="dia__mono">v0.2.0</tspan>, like a library</text>
    <text x="40" y="330" class="dia__s dia__faint">one pack, many stacks</text>

    <text x="440" y="192" class="dia__h">Your project</text>
    <text x="440" y="210" class="dia__s">by humans and agents · one stack</text>
    <text x="440" y="238" class="dia__s dia__mono">spec.md · AI_RULES.md</text>
    <text x="440" y="258" class="dia__s dia__mono">features/**.feature</text>
    <text x="440" y="278" class="dia__s dia__mono">docs/specs/traceability.md</text>
    <text x="440" y="306" class="dia__s"><tspan class="dia__mono">.specops.lock</tspan> — which pack version, exactly</text>
    <text x="440" y="330" class="dia__s dia__faint">Spring · Quarkus · Node · FastAPI · …</text>

    <g class="dia__msg">
      <path d="M300 100 H185 V158" marker-end="url(#specgate-tr-a)"/>
      <text x="196" y="122" class="dia__s">reads and lints it</text>
      <path d="M460 100 H575 V158" marker-end="url(#specgate-tr-a)"/>
      <text x="564" y="122" text-anchor="end" class="dia__s">renders it here</text>

      <path d="M350 254 H404" marker-end="url(#specgate-tr-a)"/>
      <text x="377" y="242" text-anchor="middle" class="dia__s dia__mono">specops add</text>
      <path d="M404 288 H350" marker-end="url(#specgate-tr-a)" stroke-dasharray="5 4"/>
      <text x="377" y="306" text-anchor="middle" class="dia__s dia__mono">specops sync</text>
    </g>
  </svg>
  </div>
  <figcaption>
    The pack is a dependency, not a copy-paste. A new pack version arrives as a diff
    you review — which is what keeps eleven services from drifting apart.
  </figcaption>
</figure>
