  <svg viewBox="0 0 960 684" class="dia__svg" role="img" aria-labelledby="sg-sp-t sg-sp-d">
    <title id="sg-sp-t">Two ways to start: existing code, or a new project — both end at the gate in CI</title>
    <desc id="sg-sp-d">Two lanes side by side, six steps each. Existing code: one, install
      Specgate in the project with npm i -D @rsaglobaltech/specgate. Two, adopt it, touching no
      code: npx specgate adopt. Three, set up your agent: npx specgate agents init --tool claude.
      Four, write down one behaviour you rely on: npx specgate new with that behaviour. Five,
      name its id, REQ-002, in a test that proves it, then deliver it: npx specgate apply
      REQ-002. Six, before each pull request: npx specgate check. A new project: one, create
      it with npx @rsaglobaltech/specgate@latest init, then set up your agent with npx specgate
      agents init --tool claude. Two, save the plan as docs/brief.md and turn one module into a
      draft: npx specgate propose --from-brief. Three, a person reads the draft and approves it
      at a terminal, which an agent cannot do: npx specgate change approve with the change id.
      Four, write a test that names REQ-002, then the code, and deliver it: npx specgate apply
      REQ-002. Five, once every requirement of the change is applied, archive it: npx specgate
      archive with the change id. Six, before each pull request: npx specgate check. Both lanes
      end at the same place: the gate in CI on every pull request, the same specgate check you
      run on your machine.</desc>

    <g>
      <text x="38" y="72" class="dia__h"><tspan class="dia__step">1</tspan><tspan x="62">Install it in the project</tspan></text>
      <text x="62" y="96" class="dia__s dia__mono">npm i -D @rsaglobaltech/specgate</text>
      <text x="38" y="156" class="dia__h"><tspan class="dia__step">2</tspan><tspan x="62">Adopt it, touching no code</tspan></text>
      <text x="62" y="180" class="dia__s dia__mono">npx specgate adopt</text>
      <text x="38" y="240" class="dia__h"><tspan class="dia__step">3</tspan><tspan x="62">Set up your agent</tspan></text>
      <text x="62" y="264" class="dia__s dia__mono">npx specgate agents init --tool claude</text>

      <text x="38" y="408" class="dia__h"><tspan class="dia__step">5</tspan><tspan x="62">Name REQ-002 in a test, then deliver it</tspan></text>
      <text x="62" y="432" class="dia__s dia__mono">npx specgate apply REQ-002</text>
      <text x="38" y="492" class="dia__h"><tspan class="dia__step">6</tspan><tspan x="62">Before each pull request</tspan></text>
      <text x="62" y="516" class="dia__s dia__mono">npx specgate check</text>

      <text x="532" y="66" class="dia__h"><tspan class="dia__step">1</tspan><tspan x="556">Create it, then set up your agent</tspan></text>
      <text x="556" y="87" class="dia__s dia__mono">npx @rsaglobaltech/specgate@latest init</text>
      <text x="556" y="105" class="dia__s dia__mono">npx specgate agents init --tool claude</text>
      <text x="532" y="156" class="dia__h"><tspan class="dia__step">2</tspan><tspan x="556">Save docs/brief.md, draft one module</tspan></text>
      <text x="556" y="180" class="dia__s dia__mono">npx specgate propose --from-brief</text>
      <text x="532" y="240" class="dia__h"><tspan class="dia__step">3</tspan><tspan x="556" class="dia__ok-t">Read the draft, approve it yourself</tspan></text>
      <text x="556" y="264" class="dia__s dia__mono">npx specgate change approve &lt;change-id&gt;</text>
      <text x="532" y="324" class="dia__h"><tspan class="dia__step">4</tspan><tspan x="556">A test names REQ-002, then the code</tspan></text>
      <text x="556" y="348" class="dia__s dia__mono">npx specgate apply REQ-002</text>
      <text x="532" y="408" class="dia__h"><tspan class="dia__step">5</tspan><tspan x="556">Every requirement applied: archive</tspan></text>
      <text x="556" y="432" class="dia__s dia__mono">npx specgate archive &lt;change-id&gt;</text>
      <text x="532" y="492" class="dia__h"><tspan class="dia__step">6</tspan><tspan x="556">Before each pull request</tspan></text>
      <text x="556" y="516" class="dia__s dia__mono">npx specgate check</text>

      <text x="300" y="636" class="dia__h dia__on-gate">The gate in CI on every pull request</text>
      <text x="300" y="658" class="dia__s dia__on-gate">the same <tspan class="dia__mono">specgate check</tspan> you run on your machine</text>
