<figure class="dia dia--card dia--with">

  <svg viewBox="0 0 960 336" class="dia__svg" role="img" aria-labelledby="sg-ww-t sg-ww-d">
    <title id="sg-ww-t">Without Specgate, a closed loop; with it, a gate the agent cannot edit</title>
    <desc id="sg-ww-d">Two panels side by side. Without Specgate, a closed loop: the same agent
      writes the code, writes the tests and grades itself, so all green is its own verdict;
      16 of 36 exam runs, 44 percent, met the specification. With Specgate, a gate the agent
      cannot edit: the agents — Claude Code, Codex, OpenCode — hand their work to the gate,
      which holds the sealed spec, test first, the guard and the outside judge; a person
      approves what the gate holds; what passes is delivered, and shortcuts bounce back to
      the agents. 26 of 36 runs, 72 percent, met the specification.</desc>
