    <title id="sg-ra-t">The parts of a requirement, and the three files that point back at it</title>
    <desc id="sg-ra-d">A requirement block as it is written in the delta of the change
      add-premium-discount. The heading, Requirement: REQ-007 — Apply a premium discount, is the
      id and the title; REQ-007 is what tests, tags and commits name. The sentence, The system
      SHALL discount a premium customer's order 10% before tax at checkout, is the obligation:
      one sentence with SHALL or MUST. The scenario, SCN-007 — Premium customer gets 10% off,
      is one that can fail: GIVEN a logged-in premium customer, WHEN they checkout with an
      order of 100 EUR, THEN the final price is 90 EUR, with real values. The trace comment,
      specgate:trace kind=functional actor=Customer feature=features/billing/discounts.feature,
      gives the kind, which is required, the actor and the feature file. Three things point
      back at the requirement: the feature file features/billing/discounts.feature, whose
      scenario is tagged @REQ-007 @SCN-007, and the gate matches @SCN-007; a test whose title
      names REQ-007 SCN-007, the mention that is the link; and the row of the traceability
      matrix, REQ-007, SCN-007, discounts.feature, which specgate check generates from spec.md,
      the tags and the tests and which nobody edits by hand.</desc>
