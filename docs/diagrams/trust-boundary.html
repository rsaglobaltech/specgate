    <title id="sg-tb-t">The trust boundary: what the agent's session holds, and what stays outside it</title>
    <desc id="sg-tb-d">Two areas. Inside the trust boundary is the agent's session: the coding
      agent (Claude Code, Codex or OpenCode), the guard hook, the working folder, the gate on
      stop and the refusals. Every tool call the agent makes goes to the guard hook, which
      judges it test first, over the whole working tree, against the step record and against
      a person's acts. An allowed call reaches the working folder: src, tests and features;
      docs/specs, the approved contract; approvals.json, which seals by hash; and .specgate,
      the policy and the evidence. A call that breaks a rule is refused, with the next step to
      take. When the agent stops, the gate on stop runs specgate check, which reads the
      working folder: specs and links, the sealed approval, the design scope, approved
      changes only. Outside the session is a person at a terminal, who approves, seals and
      reviews steps, and whose seals land in the working folder; and the outside judge, which
      reads the controls before the agent starts and compares them when it stops, and gives
      a verdict independent of the session. A tool with no hooks has no guard; the gate, the
      seals, the approval rule and the outside judge still hold.</desc>
