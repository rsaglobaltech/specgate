    <title id="sg-mt-t">The MCP server: an agent's tools, grouped by what they do, and what is never a tool</title>
    <desc id="sg-mt-d">An MCP client — Claude Desktop, Cursor, Claude Code, Antigravity — sends a
      tool call to the MCP server, specgate mcp serve over stdio, and gets back the command's
      JSON with its status. The server runs the Specgate CLI in the project's folder,
      projectDir: spec.md, docs/specs/, features/ and the tests. Its tools fall into three
      groups. Read the state: specgate_status, plan, read_spec, list_requirements,
      validate_project, specgate_check, specgate_verify, and specgate_change_show, list,
      status and instructions. Write the work: specgate_change_new, which is propose and
      opens a change; specgate_new, the specgate_req_ tools and specgate_fix;
      mark_requirement_done, which is apply and runs the gate first; and
      specgate_change_archive, which is archive. Tools that write the specification are
      refused while no change is open. Configure: specgate_config_get with a key, specgate_config_set with a key and a
      value, specgate_config_list and keys; specgate_agents_init, which takes only the
      project and installs every agent's commands; and specgate_harness_init. Never a tool: approving a change, since
      specgate change approve is a person's act at a terminal; and switching the guard off,
      since config set agent_guard off with no terminal fails with guard_needs_person.</desc>
