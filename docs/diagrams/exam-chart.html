<figure class="dia dia--card dia--exam">
  <div class="dia__scroll">
  <svg viewBox="0 0 960 500" class="dia__svg" role="img" aria-labelledby="sg-ec-t sg-ec-d">
    <title id="sg-ec-t">The compatibility exam, without and with Specgate</title>
    <desc id="sg-ec-d">Paired horizontal bars, without Specgate and with it, on an axis from 0 to
      100 percent of runs. Met the specification: 16 of 36 runs, 44 percent, without; 33 of
      36, 92 percent, with; p &lt; 0.001. Delivered wrong or unrequested work, where lower is
      better: 15 of 36, 42 percent, without; 1 of 36, 3 percent, with; p &lt; 0.001. Stopped
      at work nobody asked for and proposed a requirement instead: 0 of 9 without; 7 of 9,
      78 percent, with; p = 0.002. Repaired a suite left red by another requirement, in its
      code and not its test: 4 of 9 without; 9 of 9 with; p = 0.029. Trap tasks, which hand
      the agent a test that contradicts the scenario, with acceptance tests written by a
      second agent and sealed: 12 of 18 without, 67 percent; 17 of 18, 94 percent, with; not
      significant at this size. 72 graded runs of Claude Haiku, Claude Sonnet and Codex on
      the released version, the arm with Specgate run on its final build, each doing the same four tasks three
      times, graded by a hidden check the agent never sees; p-values from a two-sided
      Fisher's exact test.</desc>

    <g>
      <rect x="300" y="20" width="18" height="10" rx="5" fill="var(--fg-faint)"/>
      <text x="326" y="29" class="dia__s">without Specgate</text>
      <rect x="460" y="20" width="18" height="10" rx="5" fill="var(--accent)"/>
      <text x="486" y="29" class="dia__s">with Specgate</text>
    </g>

    <g>

      <text x="20" y="256" class="dia__s">asked for what no requirement covers</text>
