    <title id="sg-pr-t">One change, one pull request: what the author does, what the gate does, what the reviewer reads</title>
    <desc id="sg-pr-d">Three lanes, time running down: the author, the gate and the reviewer.
      One, the author proposes the change with specgate propose invoices-pdf, then writes
      proposal.md and the delta. Two, a person approves it at a terminal with specgate change
      approve invoices-pdf; an agent cannot. Three, the author writes the test, mentioning
      REQ-007 and SCN-007a, which is the link, then the code. Four, the author delivers it with
      specgate apply, which is refused while no test names the requirement; the gate runs, and
      the requirement is Implemented only when it is green. When it is red nothing is written,
      and the author fixes the code and runs apply again. Five, the author archives the change
      with specgate archive invoices-pdf, runs check, commits everything including
      traceability.md, and opens the pull request. In CI, the gate runs specgate check on every
      pull request. When it is green, six, the reviewer reads what no tool can judge: is the
      requirement one obligation, does the scenario use real values for this behaviour, does
      the test assert what the Then says, and proposal.md says why; the reviewer skips
      traceability.md, which is generated. Seven, merge: the spec and the code arrive together.
      The gate blocks a merge only when the repository requires it.</desc>

      <text x="480" y="510" text-anchor="middle" class="dia__h dia__on-gate">CI</text>
      <text x="480" y="530" text-anchor="middle" class="dia__s dia__mono dia__on-gate">specgate check</text>
      <text x="480" y="547" text-anchor="middle" class="dia__s dia__on-gate">on every PR</text>
