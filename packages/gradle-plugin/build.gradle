plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

group = 'com.rsaglobaltech'
version = '0.1.4'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

gradlePlugin {
    plugins {
        specgate {
            id = 'com.rsaglobaltech.specgate'
            implementationClass = 'com.rsaglobaltech.specgate.gradle.SpecgatePlugin'
            displayName = 'specgate spec gate'
            description = 'Run the create-spec-driven-app spec gate from Gradle — no local Node.js required.'
        }
    }
}
