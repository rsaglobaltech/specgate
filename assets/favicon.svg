<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Specgate">
  <!--
    The hexagon is drawn, not typed. `⬡` is the mark used in the site header and
    the README, but a glyph in an SVG depends on the renderer having a font that
    carries it, and a favicon has no fallback worth the name.

    Colours are literal because a favicon is loaded outside the page: no custom
    property reaches it, and there is no theme to follow. The stroke reads on
    both a light and a dark browser chrome.
  -->
  <rect width="64" height="64" rx="14" fill="#4f46e5"/>
  <path d="M32 13 L48 22.5 L48 41.5 L32 51 L16 41.5 L16 22.5 Z"
        fill="none" stroke="#ffffff" stroke-width="4.5"
        stroke-linejoin="round"/>
  <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
</svg>
