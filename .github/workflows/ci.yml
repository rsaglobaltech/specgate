# CI — the gate every change passes before it reaches `develop`, `main` or a
# release.
#
# Runs on every push to `main`, `develop` and `next/**`, on every pull request,
# and as the `verify` job of release.yml (workflow_call), so a tag is checked by
# exactly the jobs a branch is. Jobs: lint/typecheck/format, the cross-platform
# test matrix, the repository checks that do not depend on the OS (once, on
# Ubuntu), the Maven and Gradle plugins, the packed-tarball smoke test, and the
# E2E journeys (e2e.yml) on Linux, macOS and Windows.
#
# No paths-ignore: the unit suite reads the docs (tests/unit/docs-*.test.ts,
# README.md, CONTRIBUTING.md), so a docs-only change can still turn it red.
name: CI

on:
  push:
    # `develop` as well as `main`. Every pull request is merged into `develop`
    # first and only a green `develop` reaches `main`, so the checks have to run
    # on the branch that gate depends on — a merge that lands cleanly can still
    # break a suite that neither side broke alone.
    # `next/**`: the 1.0 line is built on its own branch and released as
    # candidates; it needs the same checks without touching `main`.
    branches: [main, develop, 'next/**']
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # `ci-` keeps this group apart from the caller's when release.yml calls this
  # workflow: there `github.workflow` is the caller's name, and two runs
  # sharing one group would wait on each other.
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Lint, typecheck, format (once, Ubuntu / Node 22) ─────────────────────────
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Ensure executable permissions
        run: chmod +x bin/*.js scripts/*.cjs
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check

      # CONTRIBUTING promised this for months while it did not exist. Only the
      # demo recording helpers are shell now — ADR-0008 removed the rest — but a
      # claim in the contributor guide should be true.
      - name: ShellCheck
        # The runner image ships shellcheck; apt only when it does not. A hung
        # `apt-get update` once held this job for the full 6 h job limit.
        timeout-minutes: 5
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --severity=warning $(git ls-files '*.sh')

  # ── Cross-platform test matrix ───────────────────────────────────────────────
  # Only the suites whose result can depend on the OS or the Node version run
  # here; the repository checks below run once.
  test:
    name: Test (${{ matrix.os }} / Node ${{ matrix.node }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Ensure executable permissions
        if: runner.os != 'Windows'
        run: chmod +x bin/*.js scripts/*.cjs

      - name: Build TypeScript
        run: npm run build

      # Covers dist/tests/unit and dist/packages/core/test/unit, so the core
      # unit suite is not run a second time on its own.
      - name: Run unit tests with coverage
        run: npm run test:coverage
        # c8 builds the report after 2,100+ tests: macOS runners' default heap
        # (2 GB) ran out there once every test had passed.
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Run CLI tests
        run: node --test dist/tests/cli.test.js

      - name: Run BDD tests
        run: npm run test:bdd

      - name: Run VS Code extension unit tests
        run: npm run test:vscode-unit

      - name: Run MCP server unit tests
        run: npm run test:mcp-unit

      - name: Run pack-registry unit tests
        run: npm run test:registry-unit

      - name: Run LSP server unit tests
        run: npm run test:lsp-unit

  # ── Repository checks (once, Ubuntu / Node 22) ───────────────────────────────
  # None of these depends on the OS: they ran on all six matrix legs before.
  repo-checks:
    name: Repository checks
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Ensure executable permissions
        run: chmod +x bin/*.js scripts/*.cjs
      - name: Build TypeScript
        run: npm run build

      - name: Check the agent contract document is not stale
        run: npm run docs:agent-contract:check

      # The tool has to pass its own gate. spec.md's success criteria claim it
      # does; before this step, nothing checked.
      - name: Validate this repository against its own spec gate
        run: node bin/specgate.js validate .

      - name: Build pack registry
        run: npm run registry:build

      - name: Run snapshot / determinism tests
        run: npm run test:snapshot

  # ── Maven plugin (Java 11+, no Node needed at runtime) ───────────────────────
  maven-plugin:
    name: Maven plugin
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build specgate-maven-plugin
        run: mvn -B -q package
        working-directory: packages/maven-plugin

  # ── Gradle plugin (Java 11+, no Node needed at runtime) ──────────────────────
  gradle-plugin:
    name: Gradle plugin
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build specgate-gradle-plugin
        run: gradle build --no-daemon
        working-directory: packages/gradle-plugin

  # ── Package validation (Ubuntu / Node 22) ────────────────────────────────────
  package:
    name: Package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Ensure executable permissions
        run: chmod +x bin/*.js scripts/*.cjs
      - name: Build TypeScript
        run: npm run build
      - name: Validate npm package contents
        run: npm run pack:dry-run
      - name: Smoke test from packed tarball
        run: |
          TARBALL="$(npm pack | tail -n 1)"
          npx --yes "./${TARBALL}" --help
          rm -f "${TARBALL}"

  # ── E2E: the packed package, installed, on Linux, macOS and Windows ──────────
  # A reusable-workflow call takes no `timeout-minutes`; e2e.yml sets it on its
  # own job.
  e2e:
    name: E2E
    needs: lint
    uses: ./.github/workflows/e2e.yml
