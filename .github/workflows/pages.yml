name: Deploy Docs + Pack Registry to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packs/**'
      - 'packages/pack-registry/**'
      # The generators: a fix to how the site renders changes no file under
      # docs/, and used to reach main without redeploying.
      - 'scripts/docs/**'
      - 'package.json'
      - 'schemas/**'
      - '.github/workflows/pages.yml'
      - 'README.md'
  workflow_dispatch:

# Deployed with GitHub's Pages actions, not to a branch: the repository keeps
# only `main` and `develop`, and nothing outside them holds the built site.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'docs-pages'
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        # Both generators are TypeScript; tsc emits them under dist/.
        run: npm run build

      - name: Check out the 1.0 candidate's line
        # The site carries both versions: the stable documentation at the root,
        # the candidate's under next/, and a picker between them on every page.
        # Pages deploys from main only, so main's workflow builds both; a push
        # to next/1.0 reaches the site with `gh workflow run pages.yml --ref main`.
        uses: actions/checkout@v7
        with:
          ref: next/1.0
          path: next-src

      - name: Name both versions
        id: versions
        run: |
          echo "stable=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "next=$(node -p "require('./next-src/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Render the documentation site
        # Was `cp -R docs/. _site/`, which published twenty markdown files as
        # text/markdown — a reader who followed a link got the source. This
        # renders them, with a sidebar, search and working internal links.
        run: >-
          node dist/scripts/docs/build-site.js --out _site --channel stable
          --versions stable=${{ steps.versions.outputs.stable }},next=${{ steps.versions.outputs.next }}

      - name: Render the candidate's documentation under next/
        # With that line's own generator: its pages and its navigation are its own.
        working-directory: next-src
        run: |
          npm ci
          npm run build
          node dist/scripts/docs/build-site.js --out ../_site/next --channel next --versions stable=${{ steps.versions.outputs.stable }},next=${{ steps.versions.outputs.next }}

      - name: Publish this repository's own spec-coverage report
        # P2: the one artefact a product owner would actually read — done,
        # pending, orphan features, specops drift — was the one thing the site
        # never carried. `specgate report` already writes this; it just never ran
        # here. Self-referential on purpose: this repo dogfoods itself, so its
        # own docs/specs/traceability.md is what gets reported.
        run: node dist/scripts/report.js --project-dir . --out _site/report.html

      - name: Rasterise the social card
        # og:image has to be a PNG — no major link scraper renders SVG. The SVG
        # is the source of truth and is versioned; the PNG is generated here so
        # the repository keeps shipping no binaries.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin fonts-dejavu-core
          rsvg-convert -w 1200 -h 630 -f png \
            -o _site/assets/og-card.png docs/assets/og-card.svg
          test -s _site/assets/og-card.png

      - name: Build pack registry
        # Generator emits index.html and manifest.json into --out
        run: |
          node dist/packages/pack-registry/src/build.js \
            --packs ./packs \
            --out _site/packs

      - name: Add CNAME (optional — used when packs.spec-driven.dev is configured)
        # Safe to commit even before DNS is pointed; GH Pages reads CNAME from the deployed branch
        run: |
          # Only emit CNAME if the env var is set in the repo's secrets/vars
          # (avoids accidentally claiming a domain that's not yours)
          if [ -n "${{ vars.SITE_CNAME }}" ]; then
            echo "${{ vars.SITE_CNAME }}" > _site/CNAME
            echo "Wrote CNAME for ${{ vars.SITE_CNAME }}"
          fi

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
