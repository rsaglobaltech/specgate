# E2E — the package as a user installs it, on throwaway repositories
# (e2e/run.mjs).
#
# The CI suites run the source tree; this runs `npm pack`, installs the
# tarball into an empty directory and drives the installed binary through the
# journeys a team takes: adopt, new, done, check, a stale matrix, a hand-kept
# matrix migrated, the harness, and an upgrade from the last published
# version.
#
# Reusable only: ci.yml calls it (job `E2E`) on every push and pull request,
# and through ci.yml release.yml gates the publish on it. It has no push or
# pull_request trigger of its own; run it by hand with workflow_dispatch.
name: E2E

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `e2e-` keeps this group apart from the caller's (see ci.yml).
  group: ${{ github.workflow }}-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Git identity for the harness journey
        run: |
          git config --global user.email "e2e@example.com"
          git config --global user.name "E2E"
      - name: Every command has a journey, or is listed as not covered yet
        run: node e2e/run.mjs --coverage --list
      - name: Pack, install and run the journeys
        run: node e2e/run.mjs
