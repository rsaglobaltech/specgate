# Security — npm audit, the SBOM with its licence policy, and CodeQL.
#
# Runs on pushes to `main` and `next/**`, on every pull request, and weekly,
# so a vulnerability disclosed after a merge still surfaces.
name: Security

on:
  push:
    branches: [main, 'next/**']
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after a merge still surfaces.
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # The gate audits what ships: the published package's dependencies,
      # which are none. A toolchain advisory with no fixed version yet (picomatch,
      # GHSA-fc5q-39xc-vjpf, 2026-11-18) failed every pull request and blocked a
      # release over code no user installs.
      - name: Audit (what ships)
        run: npm audit --omit=dev --audit-level=high
      # The toolchain still runs on CI, so its findings are still shown — as a
      # report, not a gate: dependabot's grouped dev updates take them in.
      - name: Audit (toolchain, report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  sbom:
    name: SBOM and licences
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build TypeScript
        run: npm run build
      # CycloneDX from npm itself — no extra dependency for a project whose
      # whole pitch is zero runtime dependencies.
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cyclonedx.json
      # The policy is ALLOWED in scripts/cli/commands/quality/LicenseCheckCommand.ts;
      # a new licence is added there and explained in docs/supply-chain.md.
      - name: Check licence policy
        run: node dist/scripts/license_check.js --sbom sbom.cyclonedx.json
      - name: Licence summary
        if: always()
        # Only the report: the step above is the one that fails the job.
        run: node dist/scripts/license_check.js --sbom sbom.cyclonedx.json --markdown >> "$GITHUB_STEP_SUMMARY" || true
      # Retained so an auditor can answer "what was in the tree on that day"
      # without rebuilding a historical dependency graph.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      - name: Analyse
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:javascript-typescript
