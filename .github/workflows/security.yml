name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after a merge still surfaces.
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # The published package has no runtime dependencies, so a high-severity
      # finding is in the toolchain — which still runs on CI with a publish
      # token in scope. `--audit-level=high` keeps this a signal, not noise.
      - name: Audit
        run: npm audit --audit-level=high

  sbom:
    name: SBOM and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # CycloneDX from npm itself — no extra dependency for a project whose
      # whole pitch is zero runtime dependencies.
      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cyclonedx.json
      - name: Check licence policy
        run: node dist/scripts/license_check.js --sbom sbom.cyclonedx.json
      - name: Licence summary
        if: always()
        run: node dist/scripts/license_check.js --sbom sbom.cyclonedx.json --markdown >> "$GITHUB_STEP_SUMMARY"
      # Retained so an auditor can answer "what was in the tree on that day"
      # without rebuilding a historical dependency graph.
      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json
          retention-days: 90

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
