name: Mutation testing

# Weekly, not per-PR: the pilot takes ~5 minutes and its score is a trend to
# watch, not a gate to pass. `break: 0` in stryker.config.mjs is deliberate —
# failing a build on a number that has not stabilised would be noise, and this
# repository has spent enough time removing checks that cried wolf.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  mutation:
    name: Stryker pilot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Run the mutation pilot
        run: npm run mutation:pilot
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
