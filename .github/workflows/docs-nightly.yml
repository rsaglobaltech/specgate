# The expensive half of the terminal recording's defence.
#
# `npm run docs:terminal:check` re-runs the real CLI in a scratch tree and diffs
# the result against docs/assets/terminal-demo.json. It is deterministic and it
# is the only thing that can prove the landing page's "this is what it actually
# prints" is still true.
#
# It is deliberately not in the pull-request job. A template or CLI change
# genuinely changes the output, so on a PR this would fail on exactly the
# correct pull requests, and "re-run and commit" would become a reflex nobody
# reads. The cheap invariants in tests/unit/docs-terminal.test.ts run on every
# commit and catch the drift that matters; this catches the rest, once a day.
name: Docs — is the recorded terminal still true?

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Re-record and diff
        run: npm run docs:terminal:check
