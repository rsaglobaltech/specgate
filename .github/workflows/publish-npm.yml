name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: 'Package version to publish, for example 0.1.0-beta.3. Leave empty to use package.json.'
        required: false
        default: ''
        type: string
      dist_tag:
        description: 'npm dist-tag to publish under'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - next
          - latest
      dry_run:
        description: 'Run npm publish in dry-run mode'
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*'

jobs:
  # The installed package, end to end, on all three platforms: a tag that
  # breaks a user's first `init` must not reach the registry.
  e2e:
    uses: ./.github/workflows/e2e.yml

  publish:
    name: Publish package
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      name: ${{ steps.package_metadata.outputs.name }}
      version: ${{ steps.package_metadata.outputs.version }}
      dist_tag: ${{ steps.publish_settings.outputs.dist_tag }}
      dry_run: ${{ steps.publish_settings.outputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Apply package version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_VERSION_RAW: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG_VERSION_RAW#v}"
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag version: $TAG_VERSION_RAW" >&2
            exit 2
          fi

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$CURRENT_VERSION" == "$TAG_VERSION" ]]; then
            echo "package.json is already at $TAG_VERSION; skipping npm version."
            exit 0
          fi

          npm version "$TAG_VERSION" --no-git-tag-version

      - name: Apply package version override
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.package_version != ''
        env:
          PACKAGE_VERSION: ${{ github.event.inputs.package_version }}
        run: |
          PACKAGE_VERSION_NORMALIZED="${PACKAGE_VERSION#v}"
          if ! [[ "$PACKAGE_VERSION_NORMALIZED" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid package_version: $PACKAGE_VERSION" >&2
            exit 2
          fi

          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$CURRENT_VERSION" == "$PACKAGE_VERSION_NORMALIZED" ]]; then
            echo "package.json is already at $PACKAGE_VERSION_NORMALIZED; skipping npm version."
            exit 0
          fi

          npm version "$PACKAGE_VERSION_NORMALIZED" --no-git-tag-version

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # REQ-556: trusted publishing (OIDC) needs npm 11.5.1 or later; npm tries
      # it first and falls back to NODE_AUTH_TOKEN until that secret is removed
      # (docs/release-process.md, "Trusted publishing").
      - name: npm for trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Ensure executable permissions
        run: |
          find bin -maxdepth 1 -type f -name "*.js" -exec chmod +x {} +
          find scripts -maxdepth 1 -type f -name "*.cjs" -exec chmod +x {} +

      - name: Run test suite
        # The full suite, not the 37 E2E cases. A release that ships without
        # the unit, BDD and package suites having run is a release nobody
        # checked — and a tag push does not trigger ci.yml, which filters on
        # branches.
        run: npm run test:all
        env:
          # As ci.yml's coverage step: merging 1.0's coverage overruns the
          # default heap, and v1.0.0-rc.12's first publish died there.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Validate npm package contents
        run: npm run pack:dry-run

      - name: Resolve package metadata
        id: package_metadata
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set publish settings
        id: publish_settings
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            # REQ-281: a release candidate (1.0.0-rc.1) is never what
            # `npm install` gives by default; only a final version is latest.
            VERSION="${{ steps.package_metadata.outputs.version }}"
            if [[ "$VERSION" == *-* ]]; then
              echo "dist_tag=next" >> "$GITHUB_OUTPUT"
            else
              echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=${{ github.event.inputs.dist_tag }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          fi

      # 0.1.4 sat unreleased for three months with no notes. A version nobody
      # wrote down is a version nobody can audit.
      - name: Check the changelog mentions this version
        run: |
          VERSION="${{ steps.package_metadata.outputs.version }}"
          # A prerelease is documented by the release it leads to: requiring an
          # entry per beta would be noise, and would push people to skip betas.
          RELEASE="${VERSION%%-*}"
          if ! grep -qF "$RELEASE" CHANGELOG.md; then
            echo "CHANGELOG.md has no entry for $RELEASE." >&2
            echo "Add one before releasing — see docs/release-process.md." >&2
            exit 1
          fi
          echo "CHANGELOG.md mentions $RELEASE (publishing $VERSION)."

      - name: Check package version availability
        if: steps.publish_settings.outputs.dry_run != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE="${{ steps.package_metadata.outputs.name }}"
          VERSION="${{ steps.package_metadata.outputs.version }}"

          if npm view "${PACKAGE}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PACKAGE}@${VERSION} already exists on npm. Choose a new package_version." >&2
            exit 1
          fi

      # REQ-571: the version said against the public surface the last release
      # froze — a patch that adds to it, or a removal outside a major, stops here.
      - name: The version against the public surface
        run: npm run contract:check -- --release "${{ steps.package_metadata.outputs.version }}"

      - name: Publish summary
        run: |
          echo "Package: ${{ steps.package_metadata.outputs.name }}"
          echo "Version: ${{ steps.package_metadata.outputs.version }}"
          echo "Dist tag: ${{ steps.publish_settings.outputs.dist_tag }}"
          echo "Dry run: ${{ steps.publish_settings.outputs.dry_run }}"

      - name: Publish (dry run)
        if: steps.publish_settings.outputs.dry_run == 'true'
        run: npm publish --tag "${{ steps.publish_settings.outputs.dist_tag }}" --access public --provenance --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # --loglevel verbose says how npm authenticated: the trusted publisher
      # (OIDC) or the NPM_TOKEN fallback. 1.0.0-rc.12 went out on the token.
      - name: Publish
        if: steps.publish_settings.outputs.dry_run != 'true'
        run: npm publish --tag "${{ steps.publish_settings.outputs.dist_tag }}" --access public --provenance --loglevel verbose
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # REQ-572: what was published, installed from the registry as a user would,
  # under the dist-tag it was meant for. A failure here is a published version
  # that does not work: the job fails loudly so the next patch is cut at once.
  smoke:
    name: The published package, installed
    needs: publish
    if: needs.publish.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Installed from the registry, then used
        env:
          PACKAGE: ${{ needs.publish.outputs.name }}
          VERSION: ${{ needs.publish.outputs.version }}
          DIST_TAG: ${{ needs.publish.outputs.dist_tag }}
        run: |
          # The registry takes a moment to serve a new version.
          for i in $(seq 1 30); do
            if npm view "${PACKAGE}@${VERSION}" version --prefer-online >/dev/null 2>&1; then break; fi
            sleep 20
          done
          TAGGED="$(npm view "${PACKAGE}" "dist-tags.${DIST_TAG}" --prefer-online)"
          if [ "$TAGGED" != "$VERSION" ]; then
            echo "dist-tag ${DIST_TAG} is ${TAGGED}, not ${VERSION}." >&2
            exit 1
          fi
          WORK="$(mktemp -d)"
          cd "$WORK"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "${PACKAGE}@${VERSION}"
          SAID="$(npx --no-install specgate --version)"
          if [ "$SAID" != "$VERSION" ]; then
            echo "specgate --version says ${SAID}, not ${VERSION}." >&2
            exit 1
          fi
          npx --no-install sgate --version
          mkdir project && cd project
          npx --no-install specgate init --yes --out . --no-git
          cd "$(ls)"
          npx --no-install specgate status --json > status.json
          node -e "const s=require('./status.json'); if (!Array.isArray(s.requirements)) process.exit(1)"
          echo "${PACKAGE}@${VERSION} installs, runs and answers, under ${DIST_TAG}."
