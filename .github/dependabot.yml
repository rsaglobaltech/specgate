version: 2
# Every update targets `develop`, like every other PR (CONTRIBUTING.md). With
# no `target-branch`, Dependabot opened against `main`, skipped the branch
# where CI and the release are cut from, and put each PR straight back on
# `main` when someone retargeted it by hand. Dependabot reads this file from
# the default branch, so it takes effect once it reaches `main`.
updates:
  # Zero runtime dependencies, so every alert here is about the build and the
  # test suite. That does not make them harmless: a compromised devDependency
  # runs on CI with a publish token in scope.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Packages that must move together. `@eslint/js` alone jumping to 10
      # while `eslint` stayed at 9 produced a peer conflict that broke
      # `npm ci` — the first thing the new audit job caught. `typescript`
      # belongs here for the same reason: TS 7 alone hit ERESOLVE against
      # `@typescript-eslint/eslint-plugin@8`, which peers on TS <6.
      typescript-and-eslint:
        patterns:
          - eslint
          - '@eslint/*'
          - '@typescript-eslint/*'
          - typescript-eslint
          - typescript
      # One PR for the routine bumps. Majors outside the groups above still
      # arrive on their own, because a major deserves a human reading it.
      dev-minor-and-patch:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Action bumps are almost always mechanical; reviewing fifteen separate
      # PRs for them is how a team learns to rubber-stamp Dependabot.
      actions:
        patterns: ['*']

  - package-ecosystem: maven
    directory: /packages/maven-plugin
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: gradle
    directory: /packages/gradle-plugin
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # JUnit 6 publishes only a Java 17 variant. The plugin compiles to
      # Java 11 on purpose — enterprise build agents are the whole reason
      # the Gradle and Maven plugins exist — so Gradle cannot resolve
      # `junit-jupiter` at all: "No matching variant ... this component
      # declares a component, compatible with Java 17 and the consumer
      # needed a component, compatible with Java 11".
      # Unblocked by raising the plugin's target to Java 17.
      - dependency-name: org.junit:junit-bom
        update-types: [version-update:semver-major]
