    status: 'Draft'
  - id: SCN-606
    requirement_id: REQ-606
    use_case: UC-604
    seed: true
    target: features/shop-orders/placing_an_order.feature
    template: templates/features/placing_an_order.feature.tpl
    feature: 'Placing an order'
