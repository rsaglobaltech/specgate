# Proven pack: Derived from the core-banking pilot (FinCore): implemented and tested in Spring Boot 3.3, Java 21 and PostgreSQL; 112 tests green.
schema_version: "1.5.0"
metadata:
  name: 'Ledger — accounts, IBAN and double-entry bookkeeping'
  version: '1.0.0'
  language: en
  project_type: backend
  tier: proven
  provenance: 'Derived from the core-banking pilot (FinCore): implemented and tested in Spring Boot 3.3, Java 21 and PostgreSQL; 112 tests green.'
variables:
  required:
    - PROJECT_NAME
    - PROJECT_SLUG
    - DOMAIN
requirements:
  - id: REQ-101
    title: 'Open an account for a customer whose KYC is verified'
    priority: Must
    description: '[functional] A customer with verified KYC gets a current account in euros at once, with a zero balance, status "active" and its own IBAN. A customer whose KYC is not verified gets no account.'
    status: 'Draft'
  - id: REQ-102
    title: 'Every account gets a valid IBAN (ISO 13616)'
    priority: Must
    description: '[business-rule] Each account is assigned an IBAN built from the country code, the two ISO 13616 check digits and the domestic account number, so that the IBAN modulo 97 is 1. The pilot issued Spanish IBANs (24 characters, fictitious bank code 9000).'
    status: 'Draft'
  - id: REQ-103
    title: 'Deposit cash into an active account'
    priority: Should
    description: '[functional] An operator deposits a positive amount in euros, with a description, into an active account. A zero or negative amount is refused.'
    status: 'Draft'
  - id: REQ-104
    title: 'Double entry, balanced and immutable'
    priority: Must
    description: '[business-rule] Every movement of money is a journal entry whose debit postings add up to its credit postings. An unbalanced entry is refused, and an entry already posted is never updated or deleted (the pilot enforced it with a database trigger as well as in the domain).'
    status: 'Draft'
  - id: REQ-105
    title: 'The balance is derived from the ledger'
    priority: Must
    description: '[business-rule] The balance of an account is the sum of its credit postings minus the sum of its debit postings; it is never stored separately.'
    status: 'Draft'
  - id: REQ-106
    title: 'Account statement, newest first'
    priority: Should
    description: '[functional] The holder sees the movements of the account from newest to oldest, each with its date, description, amount and the balance it left.'
    status: 'Draft'
  - id: REQ-107
    title: 'Only the holder sees an account'
    priority: Must
    description: '[business-rule] A customer asking for the balance, the movements or the closure of an account that is not theirs gets the same answer as for an account that does not exist, so the API does not reveal which accounts exist.'
    status: 'Draft'
  - id: REQ-108
    title: 'Block and unblock an account'
    priority: Must
    description: '[functional] An operator blocks an active account with a reason; a blocked account accepts no movements until an operator unblocks it. Unblocking an account that is not blocked is refused.'
    status: 'Draft'
  - id: REQ-109
    title: 'Close an account only at a zero balance'
    priority: Should
    description: '[functional] The holder closes an active account whose balance is zero; closing an account with money in it is refused.'
    status: 'Draft'
  - id: REQ-110
    title: 'A customer lists their own accounts'
    priority: Should
    description: '[functional] A customer sees all their accounts with IBAN, type, status and balance, in the order they were opened, and never another customer''s. Found by running the pilot: after opening an account the customer had no way to read its IBAN again.'
    status: 'Draft'
bounded_contexts:
  - id: BC-101
    name: 'Accounts'
    type: Core
    responsibility: 'Accounts, their holder, status and IBAN'
    aggregates:
      - Account
  - id: BC-102
    name: 'Ledger'
    type: Core
    responsibility: 'Journal entries and their postings'
    aggregates:
      - JournalEntry
use_cases:
  - id: UC-101
    name: 'Open Account'
    actor: 'Customer'
    requirement: REQ-101
    command: OpenAccountCommand
    aggregate: Account
    emits:
      - AccountOpened
  - id: UC-102
    name: 'Deposit Cash'
    actor: 'Operator'
    requirement: REQ-103
    command: DepositCashCommand
    aggregate: Account
    emits:
      - MoneyDeposited
      - JournalEntryPosted
  - id: UC-103
    name: 'Post Journal Entry'
    actor: 'System'
    requirement: REQ-104
    command: PostJournalEntryCommand
    aggregate: JournalEntry
    emits:
      - JournalEntryPosted
  - id: UC-104
    name: 'Read Balance'
    actor: 'Customer'
    requirement: REQ-105
    aggregate: Account
  - id: UC-105
    name: 'Read Statement'
    actor: 'Customer'
    requirement: REQ-106
    aggregate: Account
  - id: UC-106
    name: 'Block Account'
    actor: 'Operator'
    requirement: REQ-108
    command: BlockAccountCommand
    aggregate: Account
    emits:
      - AccountBlocked
      - AccountUnblocked
  - id: UC-107
    name: 'Close Account'
    actor: 'Customer'
    requirement: REQ-109
    command: CloseAccountCommand
    aggregate: Account
    emits:
      - AccountClosed
  - id: UC-108
    name: 'List My Accounts'
    actor: 'Customer'
    requirement: REQ-110
    aggregate: Account
commands:
  - id: CMD-101
    name: OpenAccountCommand
    use_case: UC-101
  - id: CMD-102
    name: DepositCashCommand
    use_case: UC-102
  - id: CMD-103
    name: PostJournalEntryCommand
    use_case: UC-103
  - id: CMD-104
    name: BlockAccountCommand
    use_case: UC-106
  - id: CMD-105
    name: CloseAccountCommand
    use_case: UC-107
aggregates:
  - id: AGG-101
    name: Account
    bounded_context: BC-101
    responsibilities:
      - 'Holder, IBAN, status (active, blocked, closed)'
    invariants:
      - 'An account is opened only for a customer with verified KYC'
      - 'A blocked or closed account accepts no movements'
    commands:
      - OpenAccountCommand
      - DepositCashCommand
      - BlockAccountCommand
      - CloseAccountCommand
    events:
      - AccountBlocked
      - AccountClosed
      - AccountOpened
      - AccountUnblocked
      - JournalEntryPosted
      - MoneyDeposited
  - id: AGG-102
    name: JournalEntry
    bounded_context: BC-102
    responsibilities:
      - 'Balanced postings, append-only'
    invariants:
      - 'Debits equal credits'
      - 'A posted entry is never changed'
    commands:
      - PostJournalEntryCommand
    events:
      - JournalEntryPosted
events:
  - id: EVT-101
    name: AccountOpened
    aggregate: Account
    payload:
      - 'accountId: string'
      - 'iban: string'
      - 'customerId: string'
  - id: EVT-102
    name: MoneyDeposited
    aggregate: Account
    payload:
      - 'accountId: string'
      - 'amount: decimal'
      - 'description: string'
  - id: EVT-103
    name: JournalEntryPosted
    aggregate: JournalEntry
    payload:
      - 'entryId: string'
      - 'postedAt: datetime'
  - id: EVT-104
    name: AccountBlocked
    aggregate: Account
    payload:
      - 'accountId: string'
      - 'reason: string'
  - id: EVT-105
    name: AccountUnblocked
    aggregate: Account
    payload:
      - 'accountId: string'
  - id: EVT-106
    name: AccountClosed
    aggregate: Account
    payload:
      - 'accountId: string'
outputs:
  files:
    - target: docs/specs/capabilities/ledger/spec.md
      template: templates/capability.md.tpl
business_rules:
  - id: RUL-101
    title: 'Money moves only through balanced journal entries'
    context: BC-102
    description: 'No code path updates a balance directly.'
  - id: RUL-102
    title: 'IBANs satisfy ISO 13616 (modulo 97 = 1)'
    context: BC-101
    description: 'Source: ISO 13616-1:2020.'
rules:
  traceability:
    target: docs/specs/traceability.md
    include_existing_rows: true
    default_status: Draft
